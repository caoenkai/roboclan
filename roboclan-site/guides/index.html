/* Roboclan color system — dark-first "deep space / lab" palette.
   Base scale + semantic aliases. One electric accent: cyan → blue → violet. */
:root {
  /* ---- Backgrounds (near-black, layered depth) ---- */
  --bg-0: #08090C;   /* deepest void — page base */
  --bg-1: #0A0B0F;   /* primary app background */
  --bg-2: #0E1015;   /* raised regions / headers */
  --bg-3: #14171D;   /* solid card fallback (no-blur) */

  /* ---- Glass surfaces (translucent, frosted) ---- */
  --surface-1: rgba(255, 255, 255, 0.030);  /* faint fill */
  --surface-2: rgba(255, 255, 255, 0.050);  /* card glass */
  --surface-3: rgba(255, 255, 255, 0.075);  /* hover / raised glass */
  --surface-solid: rgba(18, 21, 27, 0.72);  /* glass over busy bg */

  /* ---- Hairline borders ---- */
  --line: rgba(255, 255, 255, 0.08);         /* default hairline */
  --line-2: rgba(255, 255, 255, 0.12);       /* card border */
  --line-strong: rgba(255, 255, 255, 0.18);  /* hover / focus edge */

  /* ---- Text ---- */
  --text-1: #F4F6FB;   /* primary */
  --text-2: #AEB6C5;   /* secondary */
  --text-3: #6B7484;   /* muted / labels */
  --text-4: #454C5A;   /* disabled / faint */
  --text-on-accent: #0A0B0F;

  /* ---- Electric accent (the only chromatic family) ---- */
  --accent-cyan: #5BE2FF;
  --accent-blue: #5B8CFF;
  --accent-violet: #A66BFF;
  --accent: #6E8BFF;            /* single-color stand-in for the gradient */
  --accent-ink: #C9D6FF;        /* accent text on dark */
  --accent-soft: rgba(110, 139, 255, 0.14);   /* tinted fill */
  --accent-soft-2: rgba(166, 107, 255, 0.14);

  /* ---- The signature gradients ---- */
  --grad-accent: linear-gradient(120deg, #5B8CFF 0%, #A66BFF 100%); /* @kind color */
  --grad-hud: linear-gradient(135deg, #5BE2FF 0%, #6E8BFF 48%, #A66BFF 100%); /* @kind color */
  --grad-sheen: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%); /* @kind color */
  --grad-text: linear-gradient(110deg, #FFFFFF 0%, #B9C6FF 55%, #A66BFF 100%); /* @kind color */

  /* ---- Semantic ---- */
  --success: #3FE0A2;   /* best price / in stock */
  --success-soft: rgba(63, 224, 162, 0.13);
  --warn: #F5B14C;      /* coming soon / quote */
  --warn-soft: rgba(245, 177, 76, 0.13);
  --danger: #FF6B6B;    /* cons / unavailable */
  --danger-soft: rgba(255, 107, 107, 0.13);
  --live: #FF5470;      /* LIVE / hot news dot */

  /* ---- Ambient glow tints (radial backdrops) ---- */
  --glow-cyan: rgba(91, 226, 255, 0.10);
  --glow-violet: rgba(166, 107, 255, 0.12);
  --glow-blue: rgba(91, 140, 255, 0.10);
}

/* Optional light theme scope — dark is primary; this is the [data-theme=light] opt-in. */
[data-theme="light"] {
  --bg-0: #EEF1F6;
  --bg-1: #F5F7FB;
  --bg-2: #FFFFFF;
  --bg-3: #FFFFFF;
  --surface-1: rgba(10, 12, 20, 0.02);
  --surface-2: rgba(255, 255, 255, 0.72);
  --surface-3: rgba(255, 255, 255, 0.92);
  --surface-solid: rgba(255, 255, 255, 0.86);
  --line: rgba(12, 16, 28, 0.08);
  --line-2: rgba(12, 16, 28, 0.12);
  --line-strong: rgba(12, 16, 28, 0.20);
  --text-1: #11141C;
  --text-2: #4B5364;
  --text-3: #7A8294;
  --text-4: #AEB4C0;
  --accent-ink: #4F46E5;
  --glow-cyan: rgba(91, 226, 255, 0.16);
  --glow-violet: rgba(166, 107, 255, 0.18);
  --glow-blue: rgba(91, 140, 255, 0.16);
}

/* Roboclan typography — geometric display, clean body, instrument-panel mono. */
:root {
  --font-display: "Space Grotesk", "Inter Tight", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;

  /* Type scale (px). Confident, large. */
  --fs-display: 64px;   /* hero */
  --fs-h1: 44px;
  --fs-h2: 32px;
  --fs-h3: 23px;
  --fs-h4: 19px;
  --fs-body-lg: 17px;
  --fs-body: 15px;
  --fs-sm: 13.5px;
  --fs-xs: 12px;
  --fs-2xs: 11px;

  /* Weights */
  --fw-regular: 400; /* @kind font */
  --fw-medium: 500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold: 700; /* @kind font */

  /* Line heights */
  --lh-tight: 1.04; /* @kind font */
  --lh-snug: 1.22; /* @kind font */
  --lh-body: 1.55; /* @kind font */

  /* Tracking — display runs tight; mono/labels run open */
  --tracking-display: -0.025em; /* @kind font */
  --tracking-h: -0.015em; /* @kind font */
  --tracking-body: 0; /* @kind font */
  --tracking-label: 0.14em; /* @kind font */
  --tracking-mono: 0.01em; /* @kind font */
}

/* Roboclan effects — blur, shadows, glows, motion. The "glass + HUD" toolkit. */
:root {
  /* Frosted glass blur amounts */
  --blur-sm: 8px;
  --blur-md: 16px;
  --blur-lg: 28px;

  /* Shadows — very soft, long, low-opacity on dark */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.36);
  --shadow-lg: 0 24px 60px rgba(0,0,0,0.50);
  --shadow-pop: 0 30px 80px rgba(0,0,0,0.62);

  /* Inner glow / top hairline that gives glass its "lit edge" */
  --inset-hairline: inset 0 1px 0 rgba(255,255,255,0.06);
  --inset-glow: inset 0 1px 0 rgba(255,255,255,0.08), inset 0 0 40px rgba(110,139,255,0.04);

  /* Accent glows (for CTAs, active radar, focus) */
  --glow-accent-sm: 0 0 0 1px rgba(110,139,255,0.4), 0 4px 18px rgba(110,139,255,0.28);
  --glow-accent-md: 0 6px 30px rgba(110,139,255,0.40), 0 2px 10px rgba(166,107,255,0.30);
  --glow-focus: 0 0 0 3px rgba(110,139,255,0.32);
  --glow-cyan-ring: 0 0 24px rgba(91,226,255,0.45);

  /* Motion — tasteful, never bouncy */
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --dur-fast: 0.14s; /* @kind other */
  --dur-med: 0.24s; /* @kind other */
  --dur-slow: 0.5s; /* @kind other */
  --lift: translateY(-4px); /* @kind other */
}

/* Roboclan spacing & layout — 4px base grid. */
:root {
  --sp-0: 0; /* @kind spacing */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-7: 32px;
  --sp-8: 40px;
  --sp-9: 48px;
  --sp-10: 64px;
  --sp-12: 80px;
  --sp-16: 120px;

  /* Corner radii — soft hardware feel, never pill-everything */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;     /* cards */
  --r-xl: 24px;     /* modals / hero panels */
  --r-pill: 999px;

  /* Layout */
  --container: 1180px;
  --container-narrow: 760px;
  --header-h: 64px;
}

/* Roboclan base reset & ambient backdrop. Applied globally by consumers. */
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text-1);
  background-color: var(--bg-1);
  /* The signature "deep space / lab" ambient glow */
  background-image:
    radial-gradient(820px 520px at 8% -8%, var(--glow-violet), transparent 60%),
    radial-gradient(720px 480px at 96% 2%, var(--glow-cyan), transparent 58%),
    radial-gradient(900px 700px at 50% 120%, var(--glow-blue), transparent 62%);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }

::selection { background: rgba(110,139,255,0.32); color: #fff; }

/* Utility helpers used across cards & kits */
.rc-mono { font-family: var(--font-mono); font-feature-settings: "tnum" 1; letter-spacing: var(--tracking-mono); }
.rc-eyebrow {
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--text-3);
}
.rc-grad-text {
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}



.rc-ft{border-top:1px solid var(--line);margin-top:48px;background:linear-gradient(180deg,transparent,rgba(110,139,255,.025));}
.rc-ft__cols{max-width:var(--container);margin:0 auto;padding:64px 24px 44px;display:grid;grid-template-columns:repeat(5,1fr);gap:32px;}
.rc-ft__col h4{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.01em;color:var(--text-1);margin:0 0 22px;}
.rc-ft__col a{display:block;font-size:14px;color:var(--text-3);text-decoration:none;cursor:pointer;margin-bottom:15px;transition:color var(--dur-fast);width:fit-content;}
.rc-ft__col a:hover{color:var(--text-1);}
.rc-ft__bar{max-width:var(--container);margin:0 auto;padding:26px 24px 60px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--text-4);line-height:1.7;}
.rc-ft__bar .rc-ft__sig{display:flex;align-items:center;gap:9px;}
.rc-ft__bar .rc-ft__word{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.03em;color:var(--text-2);}
.rc-ft__bar .rc-ft__dis{max-width:680px;text-align:right;}
@media(max-width:920px){.rc-ft__cols{grid-template-columns:repeat(2,1fr);gap:36px 24px}}
@media(max-width:560px){.rc-ft__cols{grid-template-columns:1fr}.rc-ft__bar{flex-direction:column;gap:14px}.rc-ft__bar .rc-ft__dis{text-align:left}}

/* 静态内容页（About / How We Score / Terms / Privacy / Affiliate） */
.rc-page{max-width:760px;margin:0 auto;padding:40px 24px 88px;}
.rc-page__back{display:inline-block;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--text-3);cursor:pointer;text-decoration:none;margin-bottom:26px;transition:color var(--dur-fast);}
.rc-page__back:hover{color:var(--text-1);}
.rc-page__title{font-family:var(--font-display);font-weight:600;font-size:38px;letter-spacing:-.025em;color:var(--text-1);margin:0 0 14px;}
.rc-page__lede{font-size:17px;line-height:1.65;color:var(--text-2);margin:0 0 40px;}
.rc-news2{display:flex;flex-direction:column;gap:12px;}
.rc-news2__item{display:block;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface-1);text-decoration:none;position:relative;}
.rc-news2__item.is-link{cursor:pointer;transition:border-color .15s,background .15s;}
.rc-news2__item.is-link:hover{border-color:rgba(110,139,255,.5);background:var(--surface-2);}
.rc-news2__h{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--text-1);}
.rc-news2__b{font-size:14.5px;color:var(--text-2);margin-top:4px;line-height:1.5;}
.rc-news2__arw{position:absolute;top:18px;right:18px;color:var(--accent-ink);font-size:15px;}
.rc-news2__empty{color:var(--text-3);padding:30px 0;}
/* 导购/文章 */
.rc-guides{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
.rc-gcard{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface-1);text-decoration:none;transition:border-color .15s,transform .15s;cursor:pointer;}
.rc-gcard:hover{border-color:rgba(110,139,255,.5);transform:translateY(-2px);}
.rc-gcard__cover{height:170px;background:#fff;overflow:hidden;}
.rc-gcard__cover img{width:100%;height:100%;object-fit:cover;}
.rc-gcard__body{padding:16px 18px;}
.rc-gcard__cat{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:7px;}
.rc-gcard__t{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.25;color:var(--text-1);margin:0;}
.rc-gcard__ex{font-size:14px;color:var(--text-2);line-height:1.5;margin:8px 0 0;}
.rc-post{max-width:760px;margin:0 auto;padding:24px 24px 96px;}
.rc-post__cat{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);margin:18px 0 8px;}
.rc-post__title{font-family:var(--font-display);font-weight:600;font-size:38px;letter-spacing:-.025em;line-height:1.1;color:var(--text-1);margin:0 0 12px;}
.rc-post__meta{font-size:13.5px;color:var(--text-3);margin-bottom:22px;}
.rc-post__cover{border-radius:16px;overflow:hidden;background:#fff;margin-bottom:26px;}
.rc-post__cover img{width:100%;display:block;}
.rc-post__body{font-size:16.5px;line-height:1.75;color:var(--text-2);}
.rc-post__body h2{font-family:var(--font-display);font-weight:600;font-size:25px;color:var(--text-1);margin:34px 0 12px;letter-spacing:-.02em;}
.rc-post__body h3{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--text-1);margin:26px 0 8px;}
.rc-post__body p{margin:0 0 16px;}
.rc-post__body ul{margin:0 0 16px;padding-left:22px;}
.rc-post__body li{margin:7px 0;}
.rc-post__body a{color:var(--accent-ink);text-decoration:underline;}
.rc-post__body .lead{font-size:19px;color:var(--text-1);line-height:1.6;}
.rc-post__body .disclosure{font-size:13px;color:var(--text-3);border-top:1px solid var(--line);padding-top:16px;margin-top:32px;}
.rc-page__sec{margin-bottom:30px;}
.rc-page__sec h2{font-family:var(--font-display);font-weight:600;font-size:21px;letter-spacing:-.01em;color:var(--text-1);margin:0 0 10px;}
.rc-page__sec p{font-size:15px;line-height:1.72;color:var(--text-3);margin:0 0 12px;}

/* 对比页 */
.rc-cmp{max-width:var(--container);margin:0 auto;padding:32px 24px 80px;}
.rc-cmp__title{font-family:var(--font-display);font-weight:600;font-size:30px;letter-spacing:-.02em;color:var(--text-1);margin:14px 0 22px;}
.rc-cmp__scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;}
.rc-cmp__tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:13.5px;}
.rc-cmp__tbl th,.rc-cmp__tbl td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;}
.rc-cmp__prod{min-width:150px;}
.rc-cmp__prodhd{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.rc-cmp__rm{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;transition:all .15s;}
.rc-cmp__rm:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
.rc-cmp__emoji{font-size:30px;display:block;margin-bottom:6px;}
.rc-cmp__nm{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text-1);line-height:1.25;}
.rc-cmp__pr{font-family:var(--font-mono);font-size:12.5px;color:var(--accent-ink);margin-top:3px;}
.rc-cmp__k{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;}
.rc-cmp__v{color:var(--text-2);}
.rc-cmp__sec{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text-1);background:var(--surface-2);text-transform:uppercase;letter-spacing:.05em;}

/* 移动端防护：禁止横向溢出（错位最常见原因）；小屏内边距收紧 */
html,body{overflow-x:hidden;max-width:100%;}
.rc-app{overflow-x:hidden;}
img,svg,table{max-width:100%;}
@media(max-width:560px){
  .rc-cmp,.rc-page{padding-left:16px;padding-right:16px;}
  .rc-page__title{font-size:30px;}
}

/* 询价留资弹窗 */
.rc-lead__ov{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto;}
.rc-lead{position:relative;width:100%;max-width:560px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:20px;padding:32px 30px;box-shadow:var(--shadow-pop);}
.rc-lead__x{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text-3);font-size:26px;line-height:1;cursor:pointer;}
.rc-lead__x:hover{color:var(--text-1);}
.rc-lead__t{font-family:var(--font-display);font-weight:600;font-size:24px;color:var(--text-1);margin:0 0 8px;}
.rc-lead__sub{font-size:14px;line-height:1.6;color:var(--text-3);margin:0 0 22px;}
.rc-lead__grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:14px;}
.rc-lead__lb{display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
.rc-lead__form>.rc-lead__lb{margin-bottom:14px;}
.rc-lead__req{color:var(--accent-ink);font-style:normal;}
.rc-lead__in{font-family:var(--font-body);font-size:14px;color:var(--text-1);background:var(--surface-1);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;text-transform:none;letter-spacing:0;transition:border-color var(--dur-fast);}
.rc-lead__in:focus{outline:none;border-color:var(--accent);box-shadow:var(--glow-focus);}
.rc-lead__ta{resize:vertical;min-height:88px;}
.rc-lead__submit{margin-top:6px;width:100%;font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--text-on-accent);background:var(--grad-accent);border:none;border-radius:12px;padding:13px;cursor:pointer;box-shadow:var(--glow-accent-sm);}
.rc-lead__submit:disabled{opacity:.6;cursor:default;}
.rc-lead__errmsg{color:var(--danger);font-size:13px;margin:2px 0 0;}
.rc-lead__done{text-align:center;padding:16px 0;}
.rc-lead__check{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:var(--success);background:var(--success-soft);}
@media(max-width:520px){.rc-lead__grid{grid-template-columns:1fr;}}

/* 详情页询价区 */
.rc-dt__quotelbl{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);align-self:center;}
.rc-dt__quote{display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
.rc-dt__quotetext{font-size:14px;line-height:1.65;color:var(--text-3);margin:0;}

/* ===== 浅银灰(亮色)主题微调：把深空彩色光斑换成中性银灰，干净电商质感 ===== */
[data-theme="light"]{
  /* 柔和雾白灰：底色降一档不刺眼，卡片仍纯白留层次 */
  --bg-0:#E6E8EC; --bg-1:#ECEEF1; --bg-2:#FFFFFF; --bg-3:#FFFFFF;
  /* 环境光全部去色，几乎不可见，避免刺眼 */
  --glow-cyan:rgba(140,150,168,.04);
  --glow-violet:rgba(142,148,166,.05);
  --glow-blue:rgba(140,150,168,.04);

var POSTS=[{"id": "best-robot-vacuum-pet-hair", "title": "Best Robot Vacuum for Pet Hair (2026)", "category": "Robot Vacuums", "author": "Kai Cao", "excerpt": "Pet hair needs strong suction and an anti-tangle brush. The best robot vacuums for shedding homes in 2026, ranked on the same objective specs, from a $570 budget pick to a 4.8-rated flagship.", "cover_image": null, "body": "\n<p class=\"lead\">Pet hair is the hardest test a robot vacuum faces. It takes two things at once: strong suction to pull embedded hair out of carpet, and an anti-tangle brush so long strands don't wrap the roller into a solid mat. We scored every robot vacuum on Roboclan on the same five axes from official specs. Here are the best ones for pet-owning homes in 2026, ranked by Roboclan Score with suction and brush design in mind.</p>\n\n<h2>What actually matters for pet hair</h2>\n<p>Three things separate a great pet vacuum from a mediocre one. First is <strong>suction</strong> (measured in Pa): you need enough to lift hair that's worked its way deep into rug fibers. Second is an <strong>anti-tangle brush</strong>, a detangling or dual-roller design that channels hair straight to the bin instead of letting it wind around the brush. Third is <strong>filtration</strong> for the dander that triggers allergies. Every pick below covers all three, and we've noted the brush design for each.</p>\n\n<h2>The best robot vacuums for pet hair</h2>\n\n<h3>1. Dreame X60 Max Ultra: best overall (about $1,700)</h3>\n<p>Our highest-scored robot vacuum, at a <strong>4.8 Roboclan Score</strong>, is also our top pet-hair pick. It pairs <strong>35,000 Pa</strong> of suction with the HyperStream Detangling DuoBrush 2.0, a dual-brush design built specifically to stop long hair from wrapping. If you have a shedding dog or a long-haired cat and want the best all-around machine, this is it. See the full breakdown on the <a href=\"/robots/dreame-x60-max-ultra/\">Dreame X60 Max Ultra</a> page.</p>\n\n<h3>2. Roborock Saros 20: most suction (about $1,600)</h3>\n<p>If you want the hardest pull available, the <a href=\"/robots/roborock-saros-20/\">Roborock Saros 20</a> leads the field at <strong>36,000 Pa</strong>, with a 4.6 score and Roborock's DuoDivide anti-tangle brush. For deep-pile carpet where hair really burrows in, raw suction like this is exactly what you want.</p>\n\n<h3>3. Dreame L60 Ultra: best value (about $1,170)</h3>\n<p>The <a href=\"/robots/dreame-l60-ultra/\">Dreame L60 Ultra</a> is the value standout for pet homes: the same <strong>35,000 Pa</strong> suction and HyperStream Detangling DuoBrush as the flagships, a 4.3 score, but a launch price well under many rivals. If you want flagship-grade hair pickup without flagship pricing, start here.</p>\n\n<h3>4. Eufy Omni S2: best anti-tangle brush (about $1,600)</h3>\n<p>For very long human or pet hair, the kind that defeats most rollers, brush design matters as much as suction. The <a href=\"/robots/eufy-omni-s2/\">Eufy Omni S2</a> uses a DuoSpiral anti-tangle brush engineered to funnel long strands straight through, backed by 30,000 Pa and a 4.0 score. It's the pick if tangled rollers have been your recurring headache.</p>\n\n<h3>5. Dreame L40 Ultra Gen 2: best budget (about $570)</h3>\n<p>You don't have to spend four figures to handle pet hair well. At roughly <strong>$570</strong>, the <a href=\"/robots/dreame-l40-ultra-gen-2/\">Dreame L40 Ultra Gen 2</a> brings 25,000 Pa of suction and a 4.2 score, more than enough for most shedding pets on hard floors and low-pile rugs, and the best value on this list by a wide margin.</p>\n\n<h2>A note on mopping and allergens</h2>\n<p>Every pick here also mops, which helps with the fine dander and paw-tracked dirt that hair alone doesn't explain. If anyone in your home has allergies, empty the dock bag regularly and run the mop cycle often; the self-washing docks on these models make that nearly hands-off. Just remember that no robot fully replaces the occasional deep clean during heavy shedding season.</p>\n\n<h2>How we compare</h2>\n<p>Roboclan scores every robot vacuum on the same five axes (suction, runtime, threshold-crossing, mop-lift, and value) from each manufacturer's official published specifications, with the value score anchored to each product's original U.S. launch price. We don't accept payment for placement or scores. Shopping a tighter budget? See our <a href=\"/guides/best-robot-vacuums-under-1000/\">Best Robot Vacuums Under $1,000</a> guide. Deciding between the two biggest brands? Read <a href=\"/guides/roborock-vs-dreame/\">Roborock vs Dreame (2026)</a>. For live prices, always check the retailer.</p>\n\n<p class=\"disclosure\">Some links on this page are affiliate links, and Roboclan may earn a commission on qualifying purchases through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</p>\n", "published": true, "sort": 3, "created_at": "2026-07-11T03:03:59.024089+00:00", "updated_at": "2026-07-11T03:03:59.024089+00:00"}, {"id": "best-robot-vacuums-under-1000", "title": "Best Robot Vacuums Under $1,000 (2026)", "category": "Robot Vacuums", "author": "Kai Cao", "excerpt": "You don't need $1,500 for a great robot vacuum in 2026. The best picks under $1,000, ranked on the same objective specs, from a $570 value champion to a $270 budget pick.", "cover_image": "https://vthiulsykmdnatwoqdat.supabase.co/storage/v1/object/public/product-images/image-1783724413549-z1zy.webp", "body": "\n<p class=\"lead\">You don't need to spend $1,500 to get a genuinely great robot vacuum in 2026. The sub-$1,000 tier has quietly caught up: self-emptying and self-washing docks, 25,000+ Pa suction, and multi-hour runtimes are all here now. We scored every robot vacuum on Roboclan on the same five axes from official specs. Here are the best ones you can buy for under $1,000, ranked by Roboclan Score.</p>\n\n<h2>How we picked</h2>\n<p>Every vacuum below is scored on suction, runtime, threshold-crossing, mop-lift, and value, using each manufacturer's official published specifications. We capped the list at a $1,000 U.S. launch price and ranked by overall Roboclan Score, breaking ties by price. There's no paid placement: a brand cannot buy its way onto this list.</p>\n\n<h2>The best robot vacuums under $1,000</h2>\n\n<h3>1. Dreame L40 Ultra Gen 2: best overall (about $570)</h3>\n<p>This is the value champion of the whole category. At roughly <strong>$570</strong> it posts a <strong>4.2 Roboclan Score</strong>, higher than machines costing three times as much, on the strength of <strong>25,000 Pa</strong> suction, a class-leading <strong>231-minute</strong> runtime, and a genuine <strong>1.6-inch</strong> threshold climb that most budget robots can't touch. If you want the most capable all-rounder without crossing into flagship pricing, start here. Read the full breakdown on the <a href=\"/robots/dreame-l40-ultra-gen-2/\">Dreame L40 Ultra Gen 2</a> page.</p>\n\n<h3>2. Roborock Qrevo Curv 2 Flow: best for larger homes (about $850)</h3>\n<p>If your floor plan is big, runtime and mopping matter more than raw suction. The <a href=\"/robots/roborock-qrevo-curv-2-flow/\">Qrevo Curv 2 Flow</a> scores <strong>4.0</strong> with the longest runtime in this group, <strong>242 minutes</strong>, plus a taller <strong>0.6-inch</strong> mop-lift that keeps damp pads off your carpet. It's the pick for whole-home cleaning in one charge, and the best Roborock you can get under $1,000.</p>\n\n<h3>3. Ecovacs T90 PRO Omni: most suction (about $900)</h3>\n<p>For deep-pile carpet and heavy pet-hair homes, the <a href=\"/robots/ecovacs-t90-pro-omni/\">Ecovacs T90 PRO Omni</a> brings the hardest pull in this bracket at <strong>30,000 Pa</strong>. It scores <strong>3.7</strong> overall (runtime is shorter in its quietest mode), but if suction is your priority, nothing else under $1,000 matches it.</p>\n\n<h3>4. Dreame D30 Ultra CE: best under $500 (about $460)</h3>\n<p>The <a href=\"/robots/dreame-d30-ultra-ce/\">Dreame D30 Ultra CE</a> proves how far your money goes now. Under <strong>$500</strong>, it still delivers <strong>25,000 Pa</strong> suction and a full self-cleaning dock, landing a <strong>3.7</strong> score. You give up some threshold-climbing and mop-lift versus the pricier picks, but for a hard-floor-heavy home it's outstanding value.</p>\n\n<h3>5. Dreame D20 Air Plus: best budget pick (about $270)</h3>\n<p>The cheapest capable robot on our list, the <a href=\"/robots/dreame-d20-air-plus/\">Dreame D20 Air Plus</a> comes in around <strong>$270</strong> with <strong>20,000 Pa</strong> suction and a self-emptying base, earning a 3.5 score. It's the one to buy if you want real automation on the tightest budget and don't need hot-water mop washing.</p>\n\n<h2>What you give up versus a flagship</h2>\n<p>Under $1,000, the compromises are consistent and predictable. Mop-lift tops out around 0.4&ndash;0.6 inches (versus 0.7+ on flagships), threshold-climbing is usually 0.8&ndash;1.6 inches rather than 2+ inches, and docks skip a few conveniences like hottest-water mop washing or dual-solution dispensing. None of that matters much in a mostly hard-floor apartment; it matters more in a large, carpet-heavy, multi-room home. If you're weighing a step up, our <a href=\"/guides/saros-10r-vs-x50-ultra/\">Saros 10R vs X50 Ultra</a> comparison shows exactly what the flagship money buys.</p>\n\n<h2>How we compare</h2>\n<p>Roboclan scores every robot vacuum on the same five axes (suction, runtime, threshold-crossing, mop-lift, and value) from each manufacturer's official published specifications. Our value score is anchored to each product's original U.S. launch price so ratings stay consistent as street prices move with sales. We don't accept payment for placement or scores. For a broader look at the two biggest brands here, see our <a href=\"/guides/roborock-vs-dreame/\">Roborock vs Dreame (2026)</a> guide. For live prices, always check the retailer.</p>\n\n<p class=\"disclosure\">Some links on this page are affiliate links, and Roboclan may earn a commission on qualifying purchases through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</p>\n", "published": true, "sort": 2, "created_at": "2026-07-10T23:00:22.697862+00:00", "updated_at": "2026-07-11T03:03:59.024089+00:00"}, {"id": "saros-10r-vs-x50-ultra", "title": "Roborock Saros 10R vs Dreame X50 Ultra: Same Price, Different Strengths", "category": "Robot Vacuums", "author": "Kai Cao", "excerpt": "Two 2026 flagships at the same $1,599 launch price and the same Roboclan Score, so the winner comes down to your floors. The Dreame climbs higher; the Roborock mops and fits better.", "cover_image": "https://vthiulsykmdnatwoqdat.supabase.co/storage/v1/object/public/product-images/image-1783722759825-rigr.webp", "body": "\n<p class=\"lead\">Here's a matchup that sounds harder than it is. The Roborock Saros 10R and the Dreame X50 Ultra launched at the exact same price, $1,599.99, and they earn the exact same Roboclan Score of 4.0. On paper they look like twins. But once you line up the specs, they pull apart in a way that makes the choice surprisingly easy: it comes down to your floors, not your budget.</p>\n\n<h2>The short answer</h2>\n<p><strong>Buy the Dreame X50 Ultra if your home has high thresholds, raised door sills, or split-level transitions. Buy the Roborock Saros 10R if you have a lot of carpet, or furniture you want it to slip under.</strong> The Dreame's headline trick is that it can physically lift and climb over obstacles up to 2.4 inches tall. The Roborock counters with a taller mop-lift, slightly stronger suction, and a slimmer body. Same money, same overall rating, different superpowers.</p>\n\n<h2>Where each robot pulls ahead</h2>\n\n<h3>Climbing thresholds: Dreame, decisively</h3>\n<p>This is the X50 Ultra's whole reason for existing. Its VersaLift retractable legs raise the entire chassis to clear obstacles up to <strong>2.4 inches</strong> in double-threshold mode (1.7 inches in a single step). The Saros 10R crosses up to <strong>1.6 inches</strong>, which is very good by normal standards but not in the same league. If your home has thick transition strips, a raised bathroom sill, or a step between rooms that traps most robots, the Dreame is the one that actually gets through. That's why it scores a 5 on our threshold axis versus the Roborock's 4.</p>\n\n<h3>Mopping and carpet: Roborock</h3>\n<p>The Saros 10R lifts its mop pads <strong>0.7 inches</strong>, nearly double the Dreame's <strong>0.4 inches</strong>. More mop-lift means the robot can cross from hard floor onto carpet without dragging a damp pad across your rug, the single most useful trait in a mixed carpet-and-hardwood home. Roborock also uses a FlexiArm extending side mop and dual spinning mops to reach closer into corners and along baseboards. If mopping quality and dry carpets matter most to you, the Roborock has the edge.</p>\n\n<h3>Suction: a slight Roborock lead</h3>\n<p>The Saros 10R rates <strong>22,000 Pa</strong> against the X50 Ultra's <strong>20,000 Pa</strong>. It's a modest difference. Both are firmly in flagship territory and either will pull embedded pet hair and grit out of low-pile carpet, but on the number alone, Roborock is ahead.</p>\n\n<h3>Fitting under furniture: Roborock</h3>\n<p>The Saros 10R stands just <strong>3.1 inches</strong> tall thanks to its solid-state 3D ToF navigation, with no spinning LiDAR turret on top. The X50 Ultra is <strong>3.5 inches</strong>, and rises to 4.4 inches when its sensor lifts. If you have low sofas, beds, or cabinet kickboards, the slimmer Roborock reaches spaces the Dreame simply can't.</p>\n\n<h3>Navigation and obstacle avoidance: close</h3>\n<p>Both navigate accurately. The Dreame layers on more sensors (3D ToF plus structured light plus an AI camera), which can help it recognize and dodge small objects. The Roborock keeps it simpler with 3D ToF in a lower profile. In practice both map multi-floor homes well and set precise no-go zones; this one is close to a wash.</p>\n\n<h3>Dock and maintenance: effectively a tie</h3>\n<p>Both ship with an all-in-one dock that washes the mops in hot water, dries them with hot air, detects dirt, auto-refills the robot's tank, dispenses cleaning solution, and self-empties the dustbin. Dreame quotes 176&deg;F hot-water washing, and Roborock matches the core feature set. Whichever you pick, the day-to-day upkeep is about the same: mostly hands-off, empty the dock bag every few weeks.</p>\n\n<h2>Who should buy which</h2>\n<ul>\n  <li><strong>Buy the Dreame X50 Ultra if:</strong> your home has high thresholds, raised sills, or step transitions between rooms; you want the most capable obstacle-climber on the market; and mixed-carpet mopping isn't your top concern.</li>\n  <li><strong>Buy the Roborock Saros 10R if:</strong> you have significant carpet and want the mop kept clear of it; you need a slim robot to clean under low furniture; or you simply want the slightly stronger suction. Best all-around pick for typical hardwood-and-rug homes.</li>\n</ul>\n\n<h2>How they score on our framework</h2>\n<p>Both land at a 4.0 Roboclan Score, but the shapes of their radars differ. The Dreame peaks on threshold-crossing (5) and trades away mop-lift (3). The Roborock is more balanced, scoring 4 across suction, runtime, threshold, and mop-lift. Neither is \"better\" overall; they're tuned for different homes, which is exactly why the same score can hide such different machines. See each product page for the full breakdown: the <a href=\"/robots/dreame-x50-ultra/\">Dreame X50 Ultra</a> and the <a href=\"/robots/roborock-saros-10r/\">Roborock Saros 10R</a>.</p>\n\n<p>Want the wider brand picture behind these two models? Read our <a href=\"/guides/roborock-vs-dreame/\">Roborock vs Dreame (2026)</a> breakdown, where the same value-versus-software trade-off plays out across both lineups.</p>\n\n<h2>How we compare</h2>\n<p>Roboclan scores every robot vacuum on the same five axes (suction, runtime, threshold-crossing, mop-lift, and value) using each manufacturer's official published specifications, and our value score is anchored to each product's original U.S. launch price so ratings stay consistent as street prices move. We don't accept payment for placement or scores. For live prices, always check the retailer.</p>\n\n<p class=\"disclosure\">Some links on this page are affiliate links, and Roboclan may earn a commission on qualifying purchases through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</p>\n", "published": true, "sort": 1, "created_at": "2026-07-10T22:33:33.149183+00:00", "updated_at": "2026-07-11T03:03:59.024089+00:00"}, {"id": "roborock-vs-dreame", "title": "Roborock vs Dreame (2026): Which Brand Wins?", "category": "Robot Vacuums", "author": "Kai Cao", "excerpt": "Dreame wins on value at nearly every price point; Roborock wins on software, mop-lift, and long-term peace of mind. A data-driven breakdown, plus top picks from each brand.", "cover_image": "https://vthiulsykmdnatwoqdat.supabase.co/storage/v1/object/public/product-images/image-1783713420595-hq24.webp", "body": "\n<p class=\"lead\">Roborock and Dreame make the two most talked-about robot vacuums of 2026, and they're closer siblings than most buyers realize. Both use LiDAR navigation, self-emptying and self-washing docks, and retractable mopping. So which brand should you actually buy? Here's the honest, data-driven breakdown.</p>\n\n<h2>The short answer</h2>\n<p><strong>Dreame wins on value at almost every price point. Roborock wins on software, mop performance, and long-term peace of mind.</strong> Dreame packs roughly 90&ndash;95% of Roborock's feature set into machines that often cost 20&ndash;40% less, and its replacement parts are cheaper over the life of the robot. Roborock charges a premium, but you're paying for the best app in the category, taller mop-lift for carpet, more mature obstacle avoidance, and stronger service and update support.</p>\n<p>Neither brand is universally \"better.\" The right pick depends on your floors, your budget, and how long you plan to keep the machine.</p>\n\n<h2>Where each brand pulls ahead</h2>\n\n<h3>Value: Dreame</h3>\n<p>This is Dreame's whole strategy: match Roborock's marquee features (retractable mop, hot-water washing, dual-solution docks, high suction) and undercut on price. Across our tracked launch prices, Dreame consistently lands 20&ndash;40% below the equivalent Roborock tier, and its consumable parts (brushes, filters, mop pads) tend to run cheaper too. If you're optimizing dollars-per-feature, Dreame almost always wins the spec sheet.</p>\n\n<h3>App and software: Roborock</h3>\n<p>The Roborock app is widely considered the best in the industry: responsive, well-organized, with granular room-by-room suction control, detailed multi-floor maps, and precise no-go zones. Dreame's app is capable and has closed much of the gap, but Roborock still sets the bar for control and long-term update support.</p>\n\n<h3>Mopping and mop-lift: Roborock (mostly)</h3>\n<p>Roborock's biggest hardware edge is mop-lift height: its flagships lift the mop pads high enough to keep carpet dry when transitioning from hard floor. If your home mixes hardwood and carpet, that matters. Dreame counters with better edge and baseboard mopping thanks to its extending side mop, so for tight corners and skirting boards, Dreame can actually clean closer.</p>\n\n<h3>Navigation and obstacle avoidance: slight edge Roborock</h3>\n<p>Both use LiDAR plus camera-based obstacle avoidance and produce accurate maps. Roborock's ReactiveAI is a touch more mature at spotting small objects like cables, socks, and pet mess, which is where cheaper avoidance systems usually fail. Dreame is close and improving fast.</p>\n\n<h3>Reliability, warranty, and service: Roborock</h3>\n<p>If you plan to keep the robot for 3+ years and would be seriously inconvenienced by a slow warranty process, Roborock's longer track record, better customer service, and longer software-update support justify part of the premium. This is the least glamorous factor and often the most important one after year one.</p>\n\n<h2>Who should buy which</h2>\n<ul>\n  <li><strong>Buy Dreame if:</strong> you want the most features for your money, you're comparing similar specs at different prices, or you care most about raw suction and edge mopping. Best for value-focused buyers and mixed carpet/hard-floor homes on a budget.</li>\n  <li><strong>Buy Roborock if:</strong> you have significant hardwood, you'll keep the machine 3+ years, you want the best app, or reliable service and updates matter to you more than saving $200&ndash;$400 up front.</li>\n</ul>\n\n<h2>Top picks from each brand (2026)</h2>\n<p>Every robot below is scored on Roboclan's 5-axis framework (suction, runtime, threshold-crossing, mop-lift, value) from official published specs. See each product page for the full breakdown.</p>\n<ul>\n  <li><strong>Dreame flagship:</strong> the <a href=\"/robots/dreame-x60-max-ultra/\">Dreame X60 Max Ultra</a>, a top overall performer this year that leans into the features buyers already value rather than gimmicks.</li>\n  <li><strong>Roborock flagship:</strong> the <a href=\"/robots/roborock-saros-10r/\">Roborock Saros 10R</a>, with solid-state LiDAR and strong obstacle recognition in a slim profile.</li>\n  <li><strong>Dreame value pick:</strong> the <a href=\"/robots/dreame-x50-ultra/\">Dreame X50 Ultra</a>, near-flagship features at a lower launch price.</li>\n</ul>\n\n<h2>How we compare</h2>\n<p>Roboclan scores every robot vacuum on the same five axes using each manufacturer's official published specifications, and our value score is based on each product's original U.S. launch price, kept fixed so ratings stay consistent over time. We don't accept payment for placement or scores. This lets you compare any Roborock against any Dreame, or any other brand, on a level playing field. For live prices, always check the retailer.</p>\n\n<p class=\"disclosure\">Some links on this page are affiliate links, and Roboclan may earn a commission on qualifying purchases through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</p>\n", "published": true, "sort": 0, "created_at": "2026-07-10T14:14:15.586895+00:00", "updated_at": "2026-07-11T03:03:59.024089+00:00"}];

  // Hero visual — a living isometric robotics floor: multiple arms working, glowing pads, data links.
  function FactoryHero() {
    const add = (p, v, k) => [p[0] + v[0] * k, p[1] + v[1] * k];
    const RXv = [34, 17], DLv = [-34, 17], GN = 7, O = [240, 92];

    // Two parallel assembly-line conveyors (run along the RX iso axis), stacked in depth.
    const RX = [30, 15], DL = [-30, 15], LB = 5.8;
    const eo = [DL[0] * 0.6, DL[1] * 0.6];
    const lines = [
      { O: [150, 128] },   // back line
      { O: [42, 182] },    // front line (offset down the depth axis for clear spacing)
    ];
    const CLof = (Lo, t) => [Lo[0] + RX[0] * t, Lo[1] + RX[1] * t];

    // Robots distributed across the two lines: 3 on the back line, 2 on the front line.
    const stations = [
      { line: 0, t: 1.2, side: -1, tint: "a", label: "R-F3", d: 0.2 },
      { line: 0, t: 3.0, side:  1, tint: "a", label: "Z-7X", d: 0.9 },
      { line: 0, t: 4.7, side: -1, tint: "v", label: "Z-8X", d: 1.2, feat: true },
      { line: 1, t: 1.8, side:  1, tint: "a", label: "T-8R", d: 0.5 },
      { line: 1, t: 4.0, side: -1, tint: "a", label: "R-F2", d: 0.7 },
    ];
    const units = stations.map((st) => {
      const Lo = lines[st.line].O;
      const c = CLof(Lo, st.t);
      const base = [c[0] + DL[0] * 0.92 * st.side, c[1] + DL[1] * 0.92 * st.side];
      const u = 0.8 + st.line * 0.1 + st.t * 0.03;
      const work = [c[0], c[1] - 7];
      const S = [base[0] + (st.side > 0 ? 5 : -5) * u, base[1] - 46 * u];
      const E = [(S[0] + work[0]) / 2, Math.min(S[1], work[1]) - 15 * u];
      return { ...st, base, u, work, S, E };
    });
    const ordered = [...units].sort((a, b) => a.base[1] - b.base[1]);

    const isoBox = (cx, cy, q, hb, topF, lF, rF, key) => (
      <g key={key}>
        <polygon points={`${cx - q},${cy - hb} ${cx},${cy - hb + q * 0.5} ${cx},${cy + q * 0.5} ${cx - q},${cy}`} fill={lF} />
        <polygon points={`${cx},${cy - hb + q * 0.5} ${cx + q},${cy - hb} ${cx + q},${cy} ${cx},${cy + q * 0.5}`} fill={rF} />
        <polygon points={`${cx},${cy - hb - q * 0.5} ${cx + q},${cy - hb} ${cx},${cy - hb + q * 0.5} ${cx - q},${cy - hb}`} fill={topF} />
      </g>
    );

    const pedestal = (un) => {
      const { base, u, feat } = un;
      const panel = un.tint === "v" ? "url(#rc-fac-panelV)" : "url(#rc-fac-panel)";
      const acc = feat ? "#A66BFF" : "#6E8BFF";
      return (
        <g key={"pd" + un.label}>
          <ellipse cx={base[0]} cy={base[1] + 3} rx={14 * u} ry={5.6 * u} fill="#0B0E14" opacity="0.55" />
          <ellipse cx={base[0]} cy={base[1]} rx={14 * u} ry={5.6 * u} fill={panel} stroke="rgba(255,255,255,0.2)" strokeWidth="1" />
          <ellipse cx={base[0]} cy={base[1] - 1} rx={7.5 * u} ry={3 * u} fill="#0E1015" opacity="0.5" />
          <ellipse className="rc-fac__pad" style={{ transformBox: "fill-box", transformOrigin: "center", animationDelay: un.d + "s" }} cx={base[0]} cy={base[1]} rx={18 * u} ry={7.5 * u} fill="none" stroke={acc} strokeWidth="1.4" opacity="0.5" />
        </g>
      );
    };

    const machine = (c, key) => (
      <g key={key}>
        {isoBox(c[0], c[1], 22, 30, "#171C28", "#0A0D14", "#10141D", key + "b")}
        <polygon points={`${c[0] - 22},${c[1] - 30} ${c[0]},${c[1] - 30 + 11} ${c[0] + 22},${c[1] - 30} ${c[0]},${c[1] - 30 - 11}`} fill="none" stroke="rgba(124,150,255,0.22)" strokeWidth="1" />
        <rect x={c[0] - 8} y={c[1] - 25} width="16" height="6" rx="2" fill="#0E1015" stroke="#6E8BFF" strokeWidth="1" opacity="0.8" />
        <circle className="rc-fac__tool" style={{ transformBox: "fill-box", transformOrigin: "center" }} cx={c[0] + 13} cy={c[1] - 20} r="1.7" fill="#5BE2FF" />
      </g>
    );

    const belt = (Lo) => {
      const B1 = [Lo[0] + eo[0], Lo[1] + eo[1]], B2 = [Lo[0] - eo[0], Lo[1] - eo[1]];
      const e = CLof(Lo, LB);
      const E1 = [e[0] + eo[0], e[1] + eo[1]], E2 = [e[0] - eo[0], e[1] - eo[1]];
      const dp = 8, rollers = [];
      for (let t = 0.4; t < LB; t += 0.7) { const c = CLof(Lo, t); rollers.push([c[0] + eo[0], c[1] + eo[1], c[0] - eo[0], c[1] - eo[1]]); }
      return (
        <g>
          <polygon points={`${B1[0]},${B1[1]} ${E1[0]},${E1[1]} ${E1[0]},${E1[1] + dp} ${B1[0]},${B1[1] + dp}`} fill="#0A0D13" />
          <polygon points={`${E1[0]},${E1[1]} ${E2[0]},${E2[1]} ${E2[0]},${E2[1] + dp} ${E1[0]},${E1[1] + dp}`} fill="#0C1018" />
          <polygon points={`${B2[0]},${B2[1]} ${E2[0]},${E2[1]} ${E1[0]},${E1[1]} ${B1[0]},${B1[1]}`} fill="#12161F" stroke="rgba(124,150,255,0.22)" strokeWidth="1" />
          <g stroke="rgba(124,150,255,0.16)" strokeWidth="1">
            {rollers.map((r, k) => <line key={"r" + k} x1={r[0]} y1={r[1]} x2={r[2]} y2={r[3]} />)}
          </g>
          <line x1={B1[0]} y1={B1[1]} x2={E1[0]} y2={E1[1]} stroke="#5BE2FF" strokeWidth="1.4" opacity="0.4" />
          <line x1={B2[0]} y1={B2[1]} x2={E2[0]} y2={E2[1]} stroke="#6E8BFF" strokeWidth="1.4" opacity="0.4" />
        </g>
      );
    };

    const PART_COLORS = [
      ["#CFF6FF", "#3FC9E8", "#2C8AA8"], // cyan
      ["#D7E2FF", "#5B7BD6", "#3E579C"], // blue
      ["#ECDBFF", "#9B6FE0", "#7048B0"], // violet
      ["#CFF7E6", "#3FD49A", "#2C9C73"], // mint
      ["#FFE6C2", "#E8A94E", "#B07B2E"], // amber
      ["#FFD6E6", "#E86B9B", "#B04F77"], // pink
    ];
    const parts = (Lo, li) => {
      const arr = [];
      for (let i = -1; i <= LB - 1; i++) {
        const c = CLof(Lo, i + 0.4);
        const tn = PART_COLORS[(((i + li * 2) % PART_COLORS.length) + PART_COLORS.length) % PART_COLORS.length];
        arr.push(isoBox(c[0], c[1] - 4, 12, 13, tn[0], tn[1], tn[2], "pt" + li + "_" + i));
      }
      const a = CLof(Lo, 0.15), b = CLof(Lo, LB + 0.05);
      const clip = `${a[0] + eo[0]},${a[1] + eo[1] - 36} ${b[0] + eo[0]},${b[1] + eo[1] - 36} ${b[0] - eo[0]},${b[1] - eo[1] + 10} ${a[0] - eo[0]},${a[1] - eo[1] + 10}`;
      const cid = "rc-fac-clip" + li;
      return (
        <g>
          <clipPath id={cid}><polygon points={clip} /></clipPath>
          <g clipPath={`url(#${cid})`}>
            <g className="rc-fac__belt">{arr}</g>
          </g>
        </g>
      );
    };

    const arm = (un) => {
      const { base, u, work: W, S, E, tint, feat, d } = un;
      const limb = tint === "v" ? "url(#rc-fac-limbV)" : "url(#rc-fac-limb)";
      const panel = tint === "v" ? "url(#rc-fac-panelV)" : "url(#rc-fac-panel)";
      const acc = feat ? "#A66BFF" : "#6E8BFF";
      return (
        <g key={"a" + un.label}>
          <line x1={base[0]} y1={base[1]} x2={S[0]} y2={S[1]} stroke={limb} strokeWidth={11 * u} strokeLinecap="round" />
          <circle cx={S[0]} cy={S[1]} r={6 * u} fill={panel} stroke={acc} strokeWidth="1.2" />
          <line x1={S[0]} y1={S[1]} x2={E[0]} y2={E[1]} stroke={limb} strokeWidth={9 * u} strokeLinecap="round" />
          <line x1={S[0]} y1={S[1]} x2={E[0]} y2={E[1]} stroke={acc} strokeWidth="1.2" opacity="0.5" />
          <circle cx={E[0]} cy={E[1]} r={4.4 * u} fill="#0E1015" stroke={acc} strokeWidth="1.3" />

    .rc-cat__row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .rc-cat__rowlbl{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);width:60px;}
    .rc-cat__bar{display:flex;align-items:center;gap:12px;margin:4px 0 20px;font-size:13px;color:var(--text-3);}
    .rc-cat__reset{color:var(--accent-ink);cursor:pointer;font-weight:600;}
    .rc-cat__grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:18px;}
    .rc-cat__empty{padding:50px;color:var(--text-3);text-align:center;grid-column:1/-1;}
    `;
    document.head.appendChild(s);
  }

  function inBucket(price, b) {
    const clean = String(price).replace(/[^0-9.]/g, "");
    if (b === "Contact") return !clean;  // 询价/无公开价专档
    if (!clean) return false;            // 有价档：询价品不落入
    const n = Number(clean) || 0;
    if (b === "Under $1k") return n < 1000;
    if (b === "$1k–$3k") return n >= 1000 && n < 3000;
    if (b === "$3k–$5k") return n >= 3000 && n < 5000;
    if (b === "$5k–$15k") return n >= 5000 && n < 15000;
    return n >= 15000;                   // "$15k+"
  }

  function Catalog({ initialCat, search, initialBrand, initialPriceMin, initialPriceMax, initialTag, filterLabel, onOpen, onAdd, compare, onQuote }) {
    inject();
    const q = (search || "").toLowerCase().trim();
    const [cats, setCats] = React.useState(new Set(initialCat ? [initialCat] : []));
    const [brands, setBrands] = React.useState(new Set(initialBrand ? [initialBrand] : []));
    const [price, setPrice] = React.useState(new Set());
    // 首页矩阵带来的精确筛选：价格区间 / 用途标签
    const [pRange, setPRange] = React.useState((initialPriceMin != null || initialPriceMax != null) ? { min: initialPriceMin, max: initialPriceMax } : null);
    const [uTag, setUTag] = React.useState(initialTag || null);
    const _pnum = (p) => { const c = String(p).replace(/[^0-9.]/g, ""); return c ? Number(c) : null; };
    const inRange = (p) => { if (!pRange) return true; const n = _pnum(p); if (n == null) return false; if (pRange.min != null && n < pRange.min) return false; if (pRange.max != null && n >= pRange.max) return false; return true; };
    const tagMatch = (r) => { if (!uTag) return true; return (r.tags || []).some((t) => String(t).toLowerCase().indexOf(uTag.toLowerCase()) >= 0); };
    const buckets = ["Under $1k", "$1k–$3k", "$3k–$5k", "$5k–$15k", "$15k+", "Contact"];
    const toggle = (set, setter, v) => { const n = new Set(set); n.has(v) ? n.delete(v) : n.add(v); setter(n); };
    // Brands present in the (category-filtered) catalog, alphabetical.
    const brandList = [...new Set(DATA.robots
      .filter((r) => cats.size === 0 || cats.has(r.cat))
      .map((r) => r.brand))].sort();

    // 默认（未按品类筛选）视图跨品类轮流混排，否则前面整屏全是扫地机
    const _byCat = {};
    DATA.robots.forEach((r) => { (_byCat[r.cat] = _byCat[r.cat] || []).push(r); });
    const _catKeys = Object.keys(_byCat);
    const _mixed = [];
    for (let k = 0; ; k++) {
      let any = false;
      for (const c of _catKeys) { if (_byCat[c][k]) { _mixed.push(_byCat[c][k]); any = true; } }
      if (!any) break;
    }
    const list = _mixed.filter((r) =>
      (cats.size === 0 || cats.has(r.cat)) &&
      (brands.size === 0 || brands.has(r.brand)) &&
      (price.size === 0 || [...price].some((b) => inBucket(r.price, b))) &&
      inRange(r.price) && tagMatch(r) &&
      (!q || (r.name + " " + r.brand + " " + r.cat).toLowerCase().includes(q)));
    const active = cats.size + brands.size + price.size > 0 || pRange || uTag;

    return (
      <div className="rc-cat">
        <div className="rc-cat__head">
          <div className="rc-cat__ey">Catalog</div>
          <h1>{q ? ("Search: “" + search + "”") : (cats.size === 1 ? [...cats][0] : "All robots")}{(filterLabel && (pRange || uTag)) ? (" · " + filterLabel) : ""}</h1>
        </div>
        <div className="rc-cat__filters">
          <div className="rc-cat__row">
            <span className="rc-cat__rowlbl">Category</span>
            {DATA.categories.map((c) => (
              <Chip key={c.name} active={cats.has(c.name)} style={{ color: DATA.glow[c.name] }} onClick={() => toggle(cats, setCats, c.name)}>{c.name}</Chip>
            ))}
          </div>
          <div className="rc-cat__row">
            <span className="rc-cat__rowlbl">Brand</span>
            {brandList.map((b) => (
              <Chip key={b} active={brands.has(b)} onClick={() => toggle(brands, setBrands, b)}>{b}</Chip>
            ))}
          </div>
          <div className="rc-cat__row">
            <span className="rc-cat__rowlbl">Price</span>
            {buckets.map((b) => (
              <Chip key={b} active={price.has(b)} onClick={() => toggle(price, setPrice, b)}>{b}</Chip>
            ))}
          </div>
        </div>
        <div className="rc-cat__bar">
          <span>{list.length} robot{list.length !== 1 ? "s" : ""}</span>
          {active && <span className="rc-cat__reset" onClick={() => { setCats(new Set()); setBrands(new Set()); setPrice(new Set()); setPRange(null); setUTag(null); }}>✕ Reset filters</span>}
        </div>
        <div className="rc-cat__grid">
          {list.length === 0 && <div className="rc-cat__empty">No matches — try removing a filter.</div>}
          {list.map((r) => (
            <ProductCard key={r.id}
              name={r.name} brand={r.brand} category={r.cat} emoji={r.emoji} image={r.image}
              glow={DATA.glow[r.cat]} price={r.price} priceFrom={r.priceFrom}
              prices={r.prices} onQuote={onQuote}
              specs={r.cardSpecs} radar={r.radar} axes={r.axes || DATA.axes[r.cat]} status={r.status}
              added={compare.has(r.id)} onAdd={() => onAdd(r.id)} onOpen={() => onOpen(r.id)} />
          ))}
        </div>
      </div>
    );
  }
  window.RCCatalog = Catalog;
})();
</script>
<script type="text/babel" data-presets="react">/* Roboclan website — Product detail (the centerpiece). Shared via window.RCDetail. */
(function () {
  const { GlassCard, Radar, ScoreBadge, StatReadout, SpecRow, PriceRow, Tag, Badge, Button } = window.RoboclanDesignSystem_0955a0;
  const DATA = window.ROBOCLAN_DATA;

  // Non-breaking hyphen so words like "self-clean" / "third-party" never split.
  const nbHyph = (s) => String(s).replace(/-/g, "‑");

  // "2 in threshold" 里的 in(英寸)易被误读 → 任何"数字 + in + 英文词"统一成连字符("2‑in threshold")
  // 通用规则，未来新标签也自动处理；in 后面若是数字(如"5 in 1")则不动。
  const tidyTag = (t) => String(t).replace(/(\d[\d.,]*)\s+in\s+(?=[A-Za-z])/g, "$1‑in ");

  // 名字下的标签 = 每根雷达轴对应的真实数据值（如 "Suction 35,000 Pa"）
  const AXIS_ALIAS = {
    "Suction": ["suction"], "Runtime": ["runtime", "battery life", "battery"],
    "Threshold": ["obstacle crossing", "obstacle", "threshold"], "Mop-lift": ["mop lift", "mop-lift"],
    "Payload": ["payload", "max payload", "cabin payload"], "Speed": ["speed"],
    "DOF": ["total dof", "dof"], "Battery": ["battery", "runtime", "battery life"],
    "Cut": ["cut width", "cut"], "Cut width": ["cut width"], "Slope": ["max slope", "slope"],
    "Cleaning": ["coverage", "cleaning", "clean water"], "Capacity": ["basket", "capacity", "dustbin"],
    "Filtration": ["filtration", "filter"], "Mobility": ["max speed", "speed"],
    "Autonomy": ["navigation", "autonomy", "mapping"], "Efficiency": ["coverage", "throughput", "speed"],
    "Intelligence": ["compute", "sensing", "ai"]
  };
  function specVal(r, keys) {
    const rows = [].concat(r.specs || [], r.cardSpecs || [], r.info || []);
    for (const key of keys) {
      const hit = rows.find((row) => Array.isArray(row) && String(row[0]).toLowerCase().includes(key));
      if (hit) return String(hit[1]);
    }
    return null;
  }
  function radarTags(r) {
    const ax = r.axes || DATA.axes[r.cat] || [];
    const out = [];
    ax.forEach((a) => {
      if (a === "Value") return;                       // 性价比无实测值，跳过
      const v = specVal(r, AXIS_ALIAS[a] || [a.toLowerCase()]);
      if (v) out.push(a + " " + v);
    });
    return out;
  }

  // Title-case feature phrases: capitalize each word, but leave units,
  // acronyms and product names (anything already containing an uppercase
  // letter, or a known unit token) untouched.
  const UNITS = new Set(["in", "ft", "qt", "oz", "fl", "lb", "mph", "sq", "rpm",
    "min", "mins", "day", "days", "month", "months", "hour", "hours", "h", "hr",
    "mm", "cm", "m", "s", "mah", "pa", "aw", "v", "w", "g", "kg", "ml", "l", "dpi"]);
  function capWord(w) {
    if (/[A-Z]/.test(w)) return w;                 // acronym / product name
    if (!/[a-z]/.test(w)) return w;                // numbers / symbols only
    if (UNITS.has(w.toLowerCase().replace(/[^a-z]/g, ""))) return w;  // unit
    return w.replace(/(^|[-\/(])([a-z])/g, (m, pre, c) => pre + c.toUpperCase());
  }
  function titleCase(s) {
    return String(s).split(" ").map(capWord).join(" ");
  }

  let injected = false;
  function inject() {
    if (injected) return; injected = true;
    const s = document.createElement("style");
    s.textContent = `
    .rc-dt{max-width:var(--container);margin:0 auto;padding:24px 24px 96px;}
    .rc-dt__back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-2);cursor:pointer;margin-bottom:22px;}
    .rc-dt__back:hover{color:var(--text-1);}
    .rc-dt__top{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:stretch;}
    .rc-dt__hero{position:relative;display:grid;place-items:center;min-height:280px;overflow:hidden;}
    /* 有图时整块 hero 铺成白底（和卡片一致），产品居中充满 */
    .rc-dt__hero:has(.rc-dt__img){background:#ffffff;}
    .rc-dt__heroglow{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(50px);opacity:.5;}
    .rc-dt__emoji{position:relative;font-size:120px;filter:drop-shadow(0 16px 40px rgba(0,0,0,.6));}
    .rc-dt__img{position:relative;z-index:1;width:100%;height:100%;max-height:320px;object-fit:contain;padding:26px;box-sizing:border-box;}
    .rc-dt__gallery{display:flex;flex-direction:column;gap:10px;}
    .rc-dt__thumbs{display:flex;gap:8px;flex-wrap:wrap;}
    .rc-dt__thumb{width:56px;height:56px;border-radius:9px;border:1px solid var(--line);background:#fff;overflow:hidden;cursor:pointer;padding:4px;flex-shrink:0;}
    .rc-dt__thumb.on{border-color:var(--accent-ink);box-shadow:0 0 0 1px var(--accent-ink);}
    .rc-dt__thumb img{width:100%;height:100%;object-fit:contain;}
    .rc-dt__hero:has(.rc-dt__img) .rc-dt__heroglow{display:none;}
    /* 品类 tag：实心深底 + 品类色文字，白底/深底上都清晰 */
    .rc-dt__catpill{position:absolute;top:14px;left:14px;z-index:2;font-family:var(--font-mono);font-size:11px;
      letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:var(--r-pill);
      background:#12141b;border:1px solid rgba(255,255,255,.12);}
    .rc-dt__catpill{position:absolute;top:14px;left:14px;}
    .rc-dt__info{display:flex;flex-direction:column;justify-content:center;}
    .rc-dt__brand{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);}
    .rc-dt__name{font-family:var(--font-display);font-weight:600;font-size:42px;letter-spacing:-.03em;margin:6px 0 12px;line-height:1.05;}
    .rc-dt__tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
    .rc-dt__priced{display:flex;align-items:flex-end;gap:26px;flex-wrap:wrap;margin-top:4px;}
    .rc-dt__pricebox{display:flex;flex-direction:column;gap:2px;}
    .rc-dt__bestbig{font-family:var(--font-mono);font-size:40px;font-weight:600;color:#16a34a;line-height:1;}
    .rc-dt__bestch{font-family:var(--font-sans);font-size:15px;font-weight:500;color:#16a34a;}
    .rc-dt__msrpref{font-family:var(--font-mono);font-size:13px;color:var(--text-3);letter-spacing:.02em;}
    .rc-dt__best{font-family:var(--font-mono);font-size:13px;color:#16a34a;}
    .rc-dt__best b{color:#16a34a;}
    .rc-dt__speccard{margin-top:18px;}
    .rc-dt__panels{display:grid;grid-template-columns:.85fr 1.15fr;gap:18px;margin-top:18px;align-items:start;}
    .rc-dt__radarwrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
    .rc-dt__seclbl{font-family:var(--font-display);font-weight:600;font-size:18px;letter-spacing:-.01em;color:var(--text-1);margin:0 0 16px;}
    .rc-dt__chips{display:flex;gap:10px;flex-wrap:wrap;}
    .rc-dt__chip{flex:1;min-width:150px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-1);border:1px solid var(--line);}
    .rc-dt__chip .rc-stat__v{font-size:16px;line-height:1.3;overflow-wrap:break-word;word-break:normal;hyphens:none;}
    .rc-dt__verdict{margin-top:18px;}
    .rc-dt__verdict p{font-size:15.5px;color:var(--text-2);line-height:1.6;margin:0;}
    .rc-dt__pc{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
    .rc-dt__pccol h4{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 10px;}
    .rc-dt__pccol.pro h4{color:var(--success);} .rc-dt__pccol.con h4{color:var(--danger);}
    .rc-dt__pcli{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--text-2);margin:8px 0;line-height:1.4;}
    .rc-dt__pcli .m{flex-shrink:0;margin-top:1px;}
    .rc-dt__pcli .m.p{color:var(--success);} .rc-dt__pcli .m.c{color:var(--danger);}
    .rc-dt .rc-radar__axislabel{fill:var(--text-1);}
    /* 规格：整齐的"标签 | 值"表格，一行一条、带分隔线、更大字号，不再左右交错显得乱 */
    .rc-dt__specgrid{display:flex;flex-direction:column;}
    .rc-sc{display:flex;gap:18px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);min-width:0;}
    .rc-sc:first-child{border-top:none;}
    .rc-sc__k{flex:0 0 33%;font-family:var(--font-body);font-size:14.5px;color:var(--text-3);}
    .rc-sc__chips{flex:1;display:flex;flex-wrap:wrap;gap:8px;min-width:0;}
    .rc-feat__chip{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-mono);font-size:14px;color:var(--text-1);line-height:1.45;hyphens:none;overflow-wrap:break-word;}
    @media(max-width:560px){.rc-sc{flex-direction:column;gap:7px;}.rc-sc__k{flex:none;}}
    .rc-dt__prices{display:flex;flex-direction:column;gap:8px;}
    .rc-dt__note{font-size:12px;color:var(--text-3);margin-top:14px;line-height:1.5;}
    .rc-dt__cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;align-items:start;}
    @media(max-width:860px){.rc-dt__top{grid-template-columns:1fr}.rc-dt__panels,.rc-dt__cols,.rc-dt__pc,.rc-dt__specgrid{grid-template-columns:1fr}.rc-dt__name{font-size:32px}}
    `;
    document.head.appendChild(s);
  }

  function Detail({ robot, onBack, onAdd, compare, onQuote }) {
    inject();
    const r = robot; const glow = DATA.glow[r.cat]; const axes = r.axes || DATA.axes[r.cat];
    const imgs = (r.images && r.images.length) ? r.images : (r.image ? [r.image] : []);
    const [imgSel, setImgSel] = React.useState(0);
    const added = compare.has(r.id);
    const isQuote = /quote|contact/i.test(r.price || "");
    // 多商家价格 → 最优价（含商家、价格、链接）
    const _pr = (r.prices || []).map((row) => Array.isArray(row)
      ? { ch: row[0], p: row[1], best: row[2], url: row[3] }
      : { ch: row.retailer || row.channel || row.ch, p: row.price || row.p, best: row.best, url: row.url });
    const bestUrl = (_pr.find((x) => x.best && x.url) || _pr.find((x) => x.url) || {}).url || null;
    // best price = 你在后台填的零售/品牌链接里的最低价（一定带渠道名）；首发价只作参考、不参与
    const _numD = (s) => { const n = parseFloat(String(s).replace(/[^0-9.]/g, "")); return isFinite(n) && n > 0 ? n : 0; };
    const _GEN = { "best tracked price": 1, "pricing": 1, "price": 1, "msrp": 1 };
    const _realChD = (ch) => ch && _GEN[String(ch).toLowerCase()] !== 1 && !/\(msrp\)/i.test(ch);
    const _candsD = _pr.filter((x) => _numD(x.p)).map((x) => ({ n: _numD(x.p), p: x.p, ch: x.ch }));
    _candsD.sort((a, b) => a.n - b.n);
    const _bestD = (!isQuote && _candsD.length) ? _candsD[0] : null;
    const _msrpND = _numD(r.price);
    // best price = 零售/品牌各行里的最低价；永远展示（哪怕等于 MSRP），且比 MSRP 醒目
    const _gp = _bestD ? { p: _bestD.p, ch: _realChD(_bestD.ch) ? _bestD.ch : null } : { p: r.price, ch: null };
    return (
      <div className="rc-dt">
        <span className="rc-dt__back" onClick={onBack}>‹ Back to catalog</span>

        <div className="rc-dt__top">
          <div className="rc-dt__gallery">
            <GlassCard padded={false} className="rc-dt__hero">
              <span className="rc-dt__heroglow" style={{ background: glow }} />
              {imgs.length
                ? <img className="rc-dt__img" src={imgs[Math.min(imgSel, imgs.length - 1)]} alt={r.name} loading="lazy" />
                : <span className="rc-dt__emoji">{r.emoji}</span>}
            </GlassCard>
            {imgs.length > 1 &&
              <div className="rc-dt__thumbs">
                {imgs.map((im, i) => (
                  <button key={i} type="button" className={"rc-dt__thumb" + (i === imgSel ? " on" : "")} onClick={() => setImgSel(i)}>
                    <img src={im} alt="" />
                  </button>
                ))}
              </div>}
          </div>
          <div className="rc-dt__info">
            <div className="rc-dt__brand">{r.brand}</div>
            <h1 className="rc-dt__name">{r.name}</h1>
            <div className="rc-dt__tags">{radarTags(r).map((t) => <Tag key={t} style={{ color: "#8A6D3B", background: "#F6F1E7", borderColor: "rgba(138,109,59,.28)" }}>{tidyTag(t)}</Tag>)}</div>
            <div className="rc-dt__priced">
              {isQuote
                ? <span className="rc-dt__quotelbl">Priced by quote</span>
                : <div className="rc-dt__pricebox">
                    <span className="rc-dt__bestbig">{_gp.p}{_gp.ch ? <span className="rc-dt__bestch"> · {bestUrl ? <a href={bestUrl} target="_blank" rel="noopener" onClick={(e) => e.stopPropagation()} style={{ color: "#16a34a" }}>{_gp.ch}</a> : _gp.ch}</span> : null}</span>
                    <span className="rc-dt__msrpref">MSRP {r.price}</span>
                  </div>}
              <div style={{ marginLeft: "auto", display: "flex", gap: 10, flexWrap: "wrap" }}>
                {isQuote
                  ? <Button variant="primary" style={{ background: "linear-gradient(135deg,#22c55e,#16a34a)", color: "#fff", boxShadow: "0 0 16px rgba(34,197,94,.55)" }} onClick={() => onQuote && onQuote(r.name)}>Contact ↗</Button>
                  : <Button variant="primary" style={{ background: "linear-gradient(135deg,#22c55e,#16a34a)", color: "#fff", boxShadow: "0 0 16px rgba(34,197,94,.55)" }} onClick={() => { try { window.rcLog && window.rcLog(r.name, r.cat, "outbound"); } catch (e) {} if (bestUrl) window.open(bestUrl, "_blank", "noopener"); }}>{bestUrl ? "View deal ↗" : "View deal"}</Button>}
                <Button variant={added ? "secondary" : "primary"} style={{ boxShadow: added ? "none" : "0 0 16px rgba(110,139,255,.45)" }} onClick={() => onAdd(r.id)}>{added ? "✓ In compare" : "＋ Add to compare"}</Button>
              </div>
            </div>
            {!isQuote && r.prices && r.prices.length > 0 &&
              <p className="rc-dt__note" style={{ marginTop: 10 }}>Prices are shown for reference — check the retailer for the latest. Some links are affiliate links, and Roboclan may earn a commission on qualifying purchases through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</p>}
          </div>
        </div>

        <div className="rc-dt__panels">
          <GlassCard inset>
            <p className="rc-dt__seclbl">Ratings · 5-axis</p>
            <div className="rc-dt__radarwrap">
              <Radar values={r.radar} labels={axes} max={5} size={240} />
            </div>
          </GlassCard>
          <GlassCard>
            <p className="rc-dt__seclbl">Features &amp; Specs</p>
            <div className="rc-dt__specgrid">
              {r.specs.map(([k, v], i) => {
                const parts = String(v).split(/ · | — /).map((p) => p.trim()).filter(Boolean);
                return (
                  <div className="rc-sc" key={i}>
                    <span className="rc-sc__k">{k}</span>
                    <div className="rc-sc__chips">
                      {parts.map((p, j) => <span className="rc-feat__chip" key={j}>{nbHyph(titleCase(p))}</span>)}
                    </div>
                  </div>
                );
              })}
            </div>
          </GlassCard>
        </div>
      </div>
    );
  }
  window.RCDetail = Detail;
})();
</script>

function LeadModal({product, onClose}){

    e.preventDefault();

      const sb=window._sb;

            React.createElement("h3",{className:"rc-lead__t"},_adv?"Advertise with Roboclan":"Request a quote"),
            React.createElement("p",{className:"rc-lead__sub"},_adv?"Tell us about your brand and what you’re looking for — sponsored placements, brand partnerships, or affiliate collaboration. We’ll follow up with options and rates. No obligation, and we never sell your data.":(product+" is sold by quote. Share a few details and we’ll connect you with the brand or an authorized distributor — they’ll follow up with pricing, availability, and configuration options. No obligation, and we never sell your data.")),

}

  rows.push(React.createElement("tr",{key:"sph"},React.createElement("td",{className:"rc-cmp__sec",colSpan:items.length+1},"Specifications")));
  specKeys.forEach((k,ki)=>rows.push(React.createElement("tr",{key:"sp"+ki},
    React.createElement("td",{className:"rc-cmp__k"},k),

  return React.createElement("div",{className:"rc-cmp"},

// 独立新闻页：顶栏 News 打开，实时从 Supabase 读全部头条（可点链接）

    React.createElement("a",{className:"rc-page__back",onClick:onBack},"‹ Back"),

function App(){
  // 每个页面独立 URL：刷新/直达都停在当前页（配合 vercel.json 的 SPA 回退）
  const _catSlug=(n)=>String(n).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const _slugToCat=(s)=>{ var f=(DATA.categories||[]).find(c=>_catSlug(c.name)===s); return f?f.name:null; };
  const routeFromPath=()=>{ try{
    var p=location.pathname.replace(/\/+$/,""); var m;
    if(!p||p==="/") return {name:"home"};
    if((m=p.match(/^\/robots\/([^\/]+)$/))&&DATA.byId[m[1]]) return {name:"detail",id:m[1]};
    if(p==="/robots") return {name:"catalog",cat:null};
    if((m=p.match(/^\/c\/([^\/]+)$/))){ var cn=_slugToCat(m[1]); if(cn) return {name:"catalog",cat:cn}; }
    if(p==="/search") return {name:"catalog",cat:null,search:(new URLSearchParams(location.search).get("q")||"")};
    if(p==="/news") return {name:"news"};
    if(p==="/guides") return {name:"guides"};
    if((m=p.match(/^\/guides\/([^\/]+)$/))&&DATA.postById[m[1]]) return {name:"post",slug:m[1]};
    if((m=p.match(/^\/p\/([^\/]+)$/))&&PAGES[m[1]]) return {name:"page",key:m[1]};
    if(p==="/compare") return {name:"compare"};
  }catch(e){} return {name:"home"}; };
  const [view,setView]=React.useState(routeFromPath());
  const [compare,setCompare]=React.useState(new Set());
  const [query,setQuery]=React.useState("");
  const [lead,setLead]=React.useState(null);
  const openQuote=(name)=>setLead(name);
  const openAdvertise=()=>setLead("__ADVERTISE__");
  // 浏览器前进/后退：每次切页 pushState；按后退键 popstate 时恢复到上一页（不再跳出到 Google）
  const nav=(v)=>{setView(v);try{
    var u="/";
    if(v.name==="detail") u="/robots/"+v.id+"/";
    else if(v.name==="catalog") u=v.search?("/search?q="+encodeURIComponent(v.search)):(v.cat?("/c/"+_catSlug(v.cat)):"/robots");
    else if(v.name==="news") u="/news";
    else if(v.name==="guides") u="/guides";
    else if(v.name==="post") u="/guides/"+v.slug+"/";
    else if(v.name==="page") u="/p/"+v.key;
    else if(v.name==="compare") u="/compare";
    window.history.pushState({rcView:v},"",u);
  }catch(e){}window.scrollTo(0,0);};
  React.useEffect(()=>{
    try{window.history.replaceState({rcView:routeFromPath()},"");}catch(e){}
    const onPop=(e)=>{const v=(e.state&&e.state.rcView)||routeFromPath();setView(v);window.scrollTo(0,0);};
    window.addEventListener("popstate",onPop);
    return ()=>window.removeEventListener("popstate",onPop);
  },[]);
  const onAdd=(id)=>setCompare((c)=>{
    const n=new Set(c);
    if(n.has(id)){n.delete(id);return n;}
    if(n.size>=4){alert("You can compare up to 4 robots at once.");return n;}
    const cat=DATA.byId[id].cat;
    if([...n].some(x=>DATA.byId[x].cat!==cat)){
      alert("Compare works within one category only — different categories are scored on different axes. Clear your current selection first to compare another category.");
      return n;
    }
    n.add(id);return n;
  });
  const goHome=()=>nav({name:"home"});
  const openCategory=(cat)=>nav({name:"catalog",cat});
  const openBrowse=(cat,f,label)=>nav({name:"catalog",cat,brand:(f&&f.brand)||null,priceMin:(f&&f.min)!=null?f.min:null,priceMax:(f&&f.max)!=null?f.max:null,tag:(f&&f.tag)||null,flabel:label||null});
  const openGuides=()=>nav({name:"guides"});
  const openPost=(slug)=>nav({name:"post",slug});
  const onSearchGo=(q)=>{ if(q&&q.trim()) nav({name:"catalog",cat:null,search:q.trim()}); };
  const open=(id)=>{const r=DATA.byId[id];try{window.rcLog&&window.rcLog(r&&r.name,r&&r.cat,"view");}catch(e){}nav({name:"detail",id});};
  const openPage=(key)=>nav({name:"page",key});
  const onCompare=()=>{if(compare.size===0){alert("Add robots with the ＋ on any card (up to 4, same category) to compare.");return;}nav({name:"compare"});};
  const onNews=()=>alert("Robot News (demo) — curated headlines refresh periodically.");
  const onNav=(it)=>{if(it==="Home")goHome();else if(it==="Robots")openCategory(null);else if(it==="News")nav({name:"news"});else if(it==="Guides")openGuides();else alert(it+" — coming soon.");};
  const Header=window.RCHeader;
  return (
    <div className="rc-app">
      <Header nav={view.name==="home"?"Home":(view.name==="guides"||view.name==="post")?"Guides":view.name==="news"?"News":"Robots"} compareCount={compare.size} onHome={goHome} onNav={onNav} onCompare={onCompare} onSearch={setQuery} onSearchGo={onSearchGo} query={query} onCategory={openCategory} />
      {view.name==="home" && <window.RCHome onOpenCategory={openCategory} onOpen={open} onAdd={onAdd} compare={compare} onNews={onNews} onQuote={openQuote} onOpenGuides={openGuides} onOpenPost={openPost} onBrowse={openBrowse} />}
      {view.name==="catalog" && <window.RCCatalog key={(view.cat||"")+"|"+(view.search||"")+"|"+(view.brand||"")+"|"+(view.priceMin||"")+"|"+(view.priceMax||"")+"|"+(view.tag||"")} initialCat={view.cat} search={view.search} initialBrand={view.brand} initialPriceMin={view.priceMin} initialPriceMax={view.priceMax} initialTag={view.tag} filterLabel={view.flabel} onOpen={open} onAdd={onAdd} compare={compare} onQuote={openQuote} />}
      {view.name==="detail" && <window.RCDetail robot={DATA.byId[view.id]} onBack={()=>openCategory(DATA.byId[view.id].cat)} onAdd={onAdd} compare={compare} onQuote={openQuote} />}
      {lead && <LeadModal product={lead} onClose={()=>setLead(null)} />}
      {view.name==="page" && <PageView page={PAGES[view.key]} onHome={goHome} />}
      {view.name==="compare" && <CompareView ids={[...compare]} onOpen={open} onBack={goHome} onRemove={onAdd} />}
      {view.name==="news" && <NewsView onBack={goHome} />}
      {view.name==="guides" && <GuidesView onBack={goHome} onOpenPost={openPost} />}
      {view.name==="post" && <PostView post={DATA.postById[view.slug]} onBack={openGuides} onLink={(href)=>{ var m; if((m=href.match(/^\/robots\/([^\/]+)\/?$/))&&DATA.byId[m[1]]) open(m[1]); else if((m=href.match(/^\/guides\/([^\/]+)\/?$/))&&DATA.postById[m[1]]) openPost(m[1]); else window.location.href=href; }} />}
      <footer className="rc-ft">
        <div className="rc-ft__cols">
          <div className="rc-ft__col">
            <h4>Company</h4>
            <a onClick={()=>openPage("about")}>About Roboclan</a>
            <a onClick={()=>openPage("score")}>How We Score</a>
            <a onClick={openAdvertise}>Advertise With Us</a>
            <a href="mailto:hello@roboclan.ai">Contact</a>
          </div>
          <div className="rc-ft__col">
            <h4>Explore</h4>
            <a onClick={()=>openCategory(null)}>All Robots</a>
            <a onClick={()=>openCategory(null)}>Rankings</a>
            <a onClick={()=>alert("Buying guides — coming soon.")}>Buying Guides</a>
            <a onClick={onNews}>Robot News</a>
          </div>
          <div className="rc-ft__col">
            <h4>Top Brands</h4>
            {["Roborock","Dreame","Ecovacs","Eufy","Narwal","iRobot"].map((b)=>(
              <a key={b} onClick={()=>openCategory(null)}>{b}</a>
            ))}
          </div>
          <div className="rc-ft__col">
            <h4>Categories</h4>
            {DATA.categories.map((c)=>(
              <a key={c.name} onClick={()=>openCategory(c.name)}>{c.name}</a>
            ))}
          </div>
          <div className="rc-ft__col">
            <h4>Support</h4>
            <a href="mailto:hello@roboclan.ai">Help Center</a>
            <a onClick={()=>openPage("terms")}>Terms of Service</a>
            <a onClick={()=>openPage("privacy")}>Privacy Policy</a>
            <a onClick={()=>openPage("affiliate")}>Affiliate Disclosure</a>
          </div>
        </div>
        <div className="rc-ft__bar">
          <span className="rc-ft__sig"><span className="rc-ft__word">Roboclan</span><span>© 2026 · All rights reserved.</span></span>
          <span className="rc-ft__dis">Every robot is rated on its official specs across five categories, each scored out of 5. Value scores are based on each product's original launch price (US MSRP), kept fixed so ratings stay consistent over time — live retail prices and promotions change, so check the retailer for the latest price before buying. Some links on Roboclan are affiliate links, and Roboclan may earn a commission on qualifying purchases made through our retail and brand partners, including as an Amazon Associate. This never affects our ratings.</span>
        </div>
      </footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
